<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1270" viewBox="0 0 1400 1270" role="img" aria-labelledby="title desc">
<title id="title">06 / Ticket creation sequence</title><desc id="desc">Simplified interaction model based on the supplied workflow; delivery retries are not implemented here.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#087e78"/></marker></defs>
<rect width="1400" height="1270" fill="#f7faf9"/>
<text x="50" y="64.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193440" text-anchor="start">06 / Ticket creation sequence</text>
<text x="50" y="102.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="start">Simplified interaction model based on the supplied workflow; delivery retries are not implemented here.</text>
<rect x="35" y="165" width="170" height="65" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="120.0" y="203.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Employee</text>
<polyline points="120,230 120,1105" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" />
<rect x="285" y="165" width="170" height="65" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="370.0" y="203.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">n8n Form</text>
<polyline points="370,230 370,1105" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" />
<rect x="575" y="165" width="170" height="65" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="660.0" y="203.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">n8n workflow</text>
<polyline points="660,230 660,1105" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" />
<rect x="915" y="165" width="170" height="65" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="1000.0" y="203.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">PostgreSQL</text>
<polyline points="1000,230 1000,1105" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" />
<rect x="1185" y="165" width="170" height="65" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="1270.0" y="203.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Gmail</text>
<polyline points="1270,230 1270,1105" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" />
<polyline points="120,285 370,285" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="124" y="247" width="241" height="28" rx="3" fill="#f7faf9"/>
<text x="244.5" y="263.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">1. Submit request fields</text>
<polyline points="370,355 660,355" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="389" y="317" width="251" height="28" rx="3" fill="#f7faf9"/>
<text x="514.5" y="333.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">2. Form payload</text>
<polyline points="660,425 1000,425" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="665" y="386" width="331" height="28" rx="3" fill="#f7faf9"/>
<text x="830.5" y="402.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">3. Lookup requester and category</text>
<polyline points="1000,480 660,480" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="692" y="442" width="281" height="28" rx="3" fill="#f7faf9"/>
<text x="832.5" y="458.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">4. IDs / validation result</text>
<rect x="45" y="525" width="1310" height="585" fill="none" stroke="#b8ccc8" stroke-width="2"/>
<rect x="46" y="526" width="250" height="35" fill="#edf2f7"/>
<text x="55" y="547.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#193440" text-anchor="start">alt / reference validation</text>
<text x="62" y="585.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#193440" text-anchor="start">[invalid references]</text>
<polyline points="660,585 370,585" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="395" y="546" width="236" height="28" rx="3" fill="#f7faf9"/>
<text x="513.0" y="562.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">5a. Validation error</text>
<polyline points="370,645 120,645" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="127" y="607" width="236" height="28" rx="3" fill="#f7faf9"/>
<text x="245.0" y="623.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">Display error; no ticket</text>
<polyline points="45,685 1355,685" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" />
<text x="62" y="710.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#193440" text-anchor="start">[valid references]</text>
<polyline points="660,730 1000,730" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="662" y="689" width="336" height="28" rx="3" fill="#f7faf9"/>
<text x="830.0" y="705.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">5. Create ticket + creation history</text>
<polyline points="1000,790 660,790" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="697" y="752" width="276" height="28" rx="3" fill="#f7faf9"/>
<text x="835.0" y="768.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">6. Ticket number / result</text>
<polyline points="660,860 1270,860" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="792" y="822" width="336" height="28" rx="3" fill="#f7faf9"/>
<text x="960.0" y="838.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">7. Attempt confirmation email</text>
<polyline points="1270,920 660,920" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="797" y="882" width="336" height="28" rx="3" fill="#f7faf9"/>
<text x="965.0" y="898.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">8. Email success or error output</text>
<polyline points="660,985 370,985" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="394" y="947" width="241" height="28" rx="3" fill="#f7faf9"/>
<text x="514.5" y="963.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">9. Form confirmation</text>
<polyline points="370,1050 120,1050" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="123" y="1012" width="244" height="28" rx="3" fill="#f7faf9"/>
<text x="245.0" y="1028.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">10. Display ticket number</text>
<rect x="50" y="1140" width="1300" height="102" rx="10" fill="#e8f3ef" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="700.0" y="1168.525" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#193440" text-anchor="middle">Scope and interpretation</text>
<text x="700.0" y="1200.4750000000001" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">This documents the creation flow, not an authentication design or proof of transaction atomicity.</text>
<text x="700.0" y="1222.075" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">A form confirmation indicates the ticket result; it does not independently verify Gmail delivery.</text>
</svg>