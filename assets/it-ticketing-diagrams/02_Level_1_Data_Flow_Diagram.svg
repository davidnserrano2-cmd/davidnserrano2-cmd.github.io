<text x="700.0" y="1073.9750000000001" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Arrows summarize data exchanges; DB reads return query results to the calling process.</text>
<text x="700.0" y="1095.575" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Gmail is used for confirmations, updates, and daily reports.</text>
<text x="700.0" y="1117.1750000000002" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">No separate critical-alert workflow or notification retry queue is claimed in the MVP.</text>
