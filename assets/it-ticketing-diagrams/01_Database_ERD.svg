<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img" aria-labelledby="title desc">
<title id="title">01 / Database relationships</title><desc id="desc">Verified against PostgreSQL metadata. PK = primary key; FK = foreign key; ? = nullable.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#087e78"/></marker></defs>
<rect width="1400" height="1130" fill="#f7faf9"/>
<text x="50" y="64.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193440" text-anchor="start">01 / Database relationships</text>
<text x="50" y="102.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="start">Verified against PostgreSQL metadata. PK = primary key; FK = foreign key; ? = nullable.</text>
<rect x="60" y="170" width="340" height="234" rx="9" fill="white" stroke="#b8ccc8"/>
<rect x="60" y="170" width="340" height="48" rx="8" fill="#193440"/>
<text x="76" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">USERS</text>
<rect x="61" y="218" width="338" height="31" fill="#f1f6f4"/>
<text x="74" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">PK  user_id : integer</text>
<text x="74" y="269.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">full_name : varchar</text>
<rect x="61" y="280" width="338" height="31" fill="#f1f6f4"/>
<text x="74" y="300.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">email : varchar (unique)</text>
<text x="74" y="331.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">department : varchar ?</text>
<rect x="61" y="342" width="338" height="31" fill="#f1f6f4"/>
<text x="74" y="362.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">role : varchar</text>
<text x="74" y="393.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">created_at : timestamptz</text>
<rect x="520" y="170" width="360" height="420" rx="9" fill="white" stroke="#b8ccc8"/>
<rect x="520" y="170" width="360" height="48" rx="8" fill="#193440"/>
<text x="536" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">TICKETS</text>
<rect x="521" y="218" width="358" height="31" fill="#f1f6f4"/>
<text x="534" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">PK  ticket_id : integer</text>
<text x="534" y="269.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">FK  requester_id : integer</text>
<rect x="521" y="280" width="358" height="31" fill="#f1f6f4"/>
<text x="534" y="300.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">FK  assigned_to : integer ?</text>
<text x="534" y="331.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">FK  category_id : integer</text>
<rect x="521" y="342" width="358" height="31" fill="#f1f6f4"/>
<text x="534" y="362.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">title : varchar</text>
<text x="534" y="393.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">description : text</text>
<rect x="521" y="404" width="358" height="31" fill="#f1f6f4"/>
<text x="534" y="424.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">priority : varchar</text>
<text x="534" y="455.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">status : varchar</text>
<rect x="521" y="466" width="358" height="31" fill="#f1f6f4"/>
<text x="534" y="486.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">created_at : timestamptz</text>
<text x="534" y="517.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">first_responded_at : timestamptz ?</text>
<rect x="521" y="528" width="358" height="31" fill="#f1f6f4"/>
<text x="534" y="548.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">resolved_at : timestamptz ?</text>
<text x="534" y="579.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">closed_at : timestamptz ?</text>
<rect x="1020" y="170" width="320" height="141" rx="9" fill="white" stroke="#b8ccc8"/>
<rect x="1020" y="170" width="320" height="48" rx="8" fill="#193440"/>
<text x="1036" y="201.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">CATEGORIES</text>
<rect x="1021" y="218" width="318" height="31" fill="#f1f6f4"/>
<text x="1034" y="238.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">PK  category_id : integer</text>
<text x="1034" y="269.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">category_name : varchar (unique)</text>
<rect x="1021" y="280" width="318" height="31" fill="#f1f6f4"/>
<text x="1034" y="300.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">description : text ?</text>
<rect x="1020" y="470" width="320" height="296" rx="9" fill="white" stroke="#b8ccc8"/>
<rect x="1020" y="470" width="320" height="48" rx="8" fill="#193440"/>
<text x="1036" y="501.0" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="start">TICKET_HISTORY</text>
<rect x="1021" y="518" width="318" height="31" fill="#f1f6f4"/>
<text x="1034" y="538.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">PK  history_id : integer</text>
<text x="1034" y="569.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">FK  ticket_id : integer</text>
<rect x="1021" y="580" width="318" height="31" fill="#f1f6f4"/>
<text x="1034" y="600.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">FK  changed_by : integer ?</text>
<text x="1034" y="631.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">action : varchar</text>
<rect x="1021" y="642" width="318" height="31" fill="#f1f6f4"/>
<text x="1034" y="662.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">old_value : text ?</text>
<text x="1034" y="693.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">new_value : text ?</text>
<rect x="1021" y="704" width="318" height="31" fill="#f1f6f4"/>
<text x="1034" y="724.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">changed_at : timestamptz</text>
<text x="1034" y="755.0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#193440" text-anchor="start">notes : text ?</text>
<polyline points="520,264 455,264 455,233 400,233" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="399" y="183" width="120" height="28" rx="3" fill="#f7faf9"/>
<text x="459.0" y="199.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">requester</text>
<polyline points="520,295 430,295 430,233 400,233" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="399" y="308" width="118" height="28" rx="3" fill="#f7faf9"/>
<text x="458.0" y="324.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">assignee</text>
<polyline points="880,326 965,326 965,233 1020,233" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="885" y="183" width="130" height="28" rx="3" fill="#f7faf9"/>
<text x="950.0" y="199.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">category</text>
<polyline points="1020,564 930,564 930,233 880,233" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="882" y="585" width="132" height="28" rx="3" fill="#f7faf9"/>
<text x="948.0" y="601.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">ticket</text>
<polyline points="1340,595 1370,595 1370,875 30,875 30,233 60,233" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<text x="705.0" y="858.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">History.changed_by references Users.user_id (nullable)</text>
<rect x="60" y="655" width="820" height="140" rx="10" fill="#e8f3ef" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="470.0" y="691.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Relationship cardinalities</text>
<text x="470.0" y="723.65" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Each ticket: 1 requester, 1 category, 0..1 assigned user.</text>
<text x="470.0" y="745.25" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Each history entry: 1 ticket and 0..1 changing user.</text>
<text x="470.0" y="766.85" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Each user/category/ticket may be referenced by 0..* child records.</text>
<rect x="50" y="930" width="1300" height="172" rx="10" fill="#e8f3ef" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="700.0" y="982.025" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#193440" text-anchor="middle">Scope and interpretation</text>
<text x="700.0" y="1013.975" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Priority values: Low, Medium, High, Critical.</text>
<text x="700.0" y="1035.575" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Status values: Open, In Progress, Resolved, Closed, Cancelled.</text>
<text x="700.0" y="1057.175" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Column definitions and FK/check constraints verified; no ticket data is included.</text>
</svg>