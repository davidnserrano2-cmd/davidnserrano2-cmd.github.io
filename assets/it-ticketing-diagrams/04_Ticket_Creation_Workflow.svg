<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc">
<title id="title">04 / Employee submission workflow</title><desc id="desc">Aligned with the supplied n8n canvas and form; no critical-only alert branch.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#087e78"/></marker></defs>
<rect width="1200" height="1480" fill="#f7faf9"/>
<text x="50" y="64.0" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#193440" text-anchor="start">04 / Employee submission workflow</text>
<text x="50" y="102.0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="start">Aligned with the supplied n8n canvas and form; no critical-only alert branch.</text>
<rect x="390" y="170" width="420" height="100" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="209.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Employee submits form</text>
<text x="600.0" y="241.65" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Email, category, title, description, impact</text>
<rect x="390" y="330" width="420" height="100" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="357.85" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Read and validate references</text>
<text x="600.0" y="390.15000000000003" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Required fields; requester and category</text>
<text x="600.0" y="411.75000000000006" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">lookup</text>
<polygon points="600.0,485 750,552.5 600.0,620 450,552.5" fill="#e8f3ef" stroke="#087e78" stroke-width="2"/>
<text x="600.0" y="558.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Valid references?</text>
<rect x="50" y="500" width="260" height="105" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="180.0" y="530.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Validation result</text>
<text x="180.0" y="562.65" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Display error / invalid</text>
<text x="180.0" y="584.25" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">reference</text>
<rect x="390" y="700" width="420" height="100" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="739.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Set ticket priority</text>
<text x="600.0" y="771.65" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Map form impact to configured priority</text>
<rect x="390" y="860" width="420" height="110" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="892.85" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Create ticket &amp; history</text>
<text x="600.0" y="925.15" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">PostgreSQL creates the ticket</text>
<text x="600.0" y="946.75" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">and a creation-history entry</text>
<rect x="390" y="1030" width="420" height="100" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="1069.35" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Attempt Gmail confirmation</text>
<text x="600.0" y="1101.6499999999999" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Send confirmation email</text>
<rect x="390" y="1200" width="420" height="95" rx="10" fill="#ffffff" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="1236.85" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#193440" text-anchor="middle">Show form confirmation</text>
<text x="600.0" y="1269.1499999999999" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">Return ticket number to employee</text>
<polyline points="600,270 600,330" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="600,430 600,485" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="600,800 600,860" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="600,970 600,1030" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<polyline points="600,620 600,700" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="611" y="642" width="56" height="28" rx="3" fill="#f7faf9"/>
<text x="639.0" y="658.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">Yes</text>
<polyline points="450,552 310,552" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="332" y="514" width="56" height="28" rx="3" fill="#f7faf9"/>
<text x="360.0" y="530.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">No</text>
<polyline points="600,1130 600,1200" fill="none" stroke="#087e78" stroke-width="2" stroke-linejoin="round"  marker-end="url(#arrow)"/>
<rect x="627" y="1148" width="246" height="28" rx="3" fill="#f7faf9"/>
<text x="750.0" y="1164.0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#526975" text-anchor="middle">Success or error output</text>
<rect x="50" y="1320" width="1100" height="132" rx="10" fill="#e8f3ef" stroke="#b8ccc8" stroke-width="1.5"/>
<text x="600.0" y="1363.525" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#193440" text-anchor="middle">Scope and interpretation</text>
<text x="600.0" y="1395.4750000000001" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">The canvas routes both Gmail outputs to the form ending; a success page does not prove email delivery.</text>
<text x="600.0" y="1417.075" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#526975" text-anchor="middle">No retry queue is shown. SQL transaction details are outside this diagram’s verified scope.</text>
</svg>