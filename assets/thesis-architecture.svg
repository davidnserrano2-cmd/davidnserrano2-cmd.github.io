<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc">
  <title id="title">Thesis prototype architecture</title>
  <desc id="desc">RFID reader, keypad and tamper switch feed an Arduino Nano 33 IoT. Serial messages connect the Arduino to a Raspberry Pi Zero 2 W, which handles authentication, SQLite event logging, serial recovery and a Tkinter admin interface. Outcome feedback is shown on an LCD, RGB LED and buzzer connected to the Arduino.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6e83a4"/></marker>
    <marker id="arrow-rev" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#6e83a4"/></marker>
    <style>
      .bg{fill:#f7f9fc}.card{fill:#fff;stroke:#d4dce8;stroke-width:2}.core{fill:#eef4ff;stroke:#9eb8e6;stroke-width:2}.future{fill:#fff9ed;stroke:#e5c27e;stroke-width:2;stroke-dasharray:8 6}.title{font:700 23px system-ui,sans-serif;fill:#17243a}.subtitle{font:500 15px system-ui,sans-serif;fill:#56677e}.label{font:700 13px system-ui,sans-serif;letter-spacing:1px;fill:#63748b}.body{font:600 17px system-ui,sans-serif;fill:#1d2c44}.small{font:500 14px system-ui,sans-serif;fill:#53657c}.arrow{stroke:#6e83a4;stroke-width:3;fill:none;marker-end:url(#arrow)}.bi{stroke:#6e83a4;stroke-width:3;fill:none;marker-start:url(#arrow-rev);marker-end:url(#arrow)}.dash{stroke:#d19c3b;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect class="bg" width="1120" height="790" rx="24"/>
  <text x="56" y="58" class="label">RECREATED FROM THE THESIS ARCHITECTURE FIGURE</text>
  <text x="56" y="96" class="title">A hardware edge with a local control and monitoring layer</text>
  <text x="56" y="124" class="subtitle">Documented prototype design · arrows summarize the paper, not a production deployment</text>

  <rect class="card" x="56" y="174" width="250" height="180" rx="16"/>
  <text x="82" y="210" class="label">INPUT &amp; TAMPER</text>
  <text x="82" y="248" class="body">RFID reader · RC522</text>
  <text x="82" y="279" class="body">Keypad · ZRX543</text>
  <text x="82" y="310" class="body">Endstop switch</text>
  <text x="82" y="337" class="small">User/device interaction</text>

  <path class="arrow" d="M306 264H363"/>
  <rect class="core" x="374" y="174" width="300" height="180" rx="16"/>
  <text x="402" y="210" class="label">DEVICE CONTROL</text>
  <text x="402" y="250" class="body">Arduino Nano 33 IoT</text>
  <text x="402" y="282" class="small">RFID, PIN and tamper handling</text>
  <text x="402" y="312" class="small">Serial communication · 9600 baud</text>
  <text x="402" y="337" class="small">LCD · RGB LED · buzzer</text>

  <path class="bi" d="M674 264H733"/>
  <text x="677" y="238" class="small">serial</text>
  <rect class="core" x="744" y="174" width="320" height="180" rx="16"/>
  <text x="772" y="210" class="label">LOCAL CONTROL &amp; BACKEND</text>
  <text x="772" y="250" class="body">Raspberry Pi Zero 2 W</text>
  <text x="772" y="282" class="small">Python · access decision logic</text>
  <text x="772" y="312" class="small">SQLite · event logging</text>
  <text x="772" y="337" class="small">Serial listener and recovery</text>

  <path class="arrow" d="M904 354V418"/>
  <rect class="card" x="744" y="430" width="320" height="130" rx="16"/>
  <text x="772" y="468" class="label">ADMINISTRATION</text>
  <text x="772" y="507" class="body">Custom Tkinter dashboard</text>
  <text x="772" y="536" class="small">Status · access logs · user controls</text>

  <path class="arrow" d="M524 354V418"/>
  <rect class="card" x="374" y="430" width="300" height="130" rx="16"/>
  <text x="402" y="468" class="label">ON-DEVICE FEEDBACK</text>
  <text x="402" y="507" class="body">LCD · RGB LED · buzzer</text>
  <text x="402" y="536" class="small">Outcome and status cues</text>

  <path class="dash" d="M56 620H1064"/>
  <rect class="future" x="56" y="646" width="1008" height="96" rx="16"/>
  <text x="82" y="683" class="label">THESIS FUTURE WORK — NOT IMPLEMENTED IN THE DEMO</text>
  <text x="82" y="716" class="small">Secure device communication · stronger credential protection · multiple doors · remote administration</text>
</svg>
